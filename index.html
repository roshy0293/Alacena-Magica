<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alacena Mágica - Tu cocina inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde-oscuro: #1D381C;
      --verde-marca: #4F772D;
      --verde-claro: #90A955;
      --gris-claro: #ECF3D9;
      --blanco: #FFFFFF;
      --nav-h: 80px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; color: var(--verde-oscuro); background: var(--blanco); line-height: 1.6; }
    
    /* NAVBAR */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: var(--nav-h); display: flex; align-items: center;
      transition: background 0.4s ease, box-shadow 0.4s ease, backdrop-filter 0.4s ease;
      border-bottom: 1px solid transparent;
    }
    .nav.is-scrolled {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      border-bottom-color: var(--gris-claro);
      box-shadow: 0 6px 30px rgba(29, 56, 28, 0.08);
    }
    .nav-inner {
      width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .nav-logo { display: flex; align-items: center; text-decoration: none; transition: transform 0.3s ease; }
    .nav-logo:hover { transform: scale(1.02); }
    .nav-logo-img { height: 48px; width: auto; object-fit: contain; transition: height 0.4s ease; }
    .nav.is-scrolled .nav-logo-img { height: 40px; }
    
    .nav-links ul { display: flex; list-style: none; gap: 2rem; margin: 0; padding: 0; }
    .nav-links a {
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--verde-oscuro); opacity: 0.85; transition: opacity 0.2s ease, color 0.2s ease;
      text-decoration: none;
    }
    .nav-links a:hover { opacity: 1; color: var(--verde-marca); }
    
    .nav-cta {
      background: var(--verde-oscuro); color: #fff !important; opacity: 1 !important;
      padding: 10px 22px; border-radius: 50px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-size: 0.85rem; text-transform: uppercase; font-weight: 700;
    }
    .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(29, 56, 28, 0.3); }
    
    .nav-burger {
      display: none; flex-direction: column; gap: 5px; padding: 10px;
      min-width: 44px; min-height: 44px; background: none; border: none; cursor: pointer;
    }
    .nav-burger span {
      display: block; width: 26px; height: 3px; border-radius: 3px;
      background: var(--verde-oscuro); transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .nav-burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .nav-burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .nav-burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    @media (max-width: 1080px) {
      .nav-burger { display: flex; }
      .nav-links {
        position: absolute; top: 100%; left: 0; right: 0;
        background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(16px);
        flex-direction: column; padding: 2rem; gap: 1.5rem;
        transform: translateY(-10px); opacity: 0; visibility: hidden;
        transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(29, 56, 28, 0.1);
      }
      .nav-links.is-open { transform: translateY(0); opacity: 1; visibility: visible; }
      .nav-links ul { flex-direction: column; width: 100%; text-align: center; }
      .nav-cta { width: 100%; text-align: center; margin-top: 1rem; }
    }

    /* HERO SECTION (Para demo) */
    .hero {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--gris-claro) 0%, #fff 100%);
      text-align: center; padding: 0 20px;
    }
    .hero h1 { font-size: 3rem; margin-bottom: 1rem; color: var(--verde-oscuro); }
    .hero p { font-size: 1.2rem; max-width: 600px; margin: 0 auto; color: var(--verde-marca); }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="nav" id="nav" role="banner">
    <div class="nav-inner container">
      <!-- LOGO CON IMAGEN -->
      <a href="#" class="nav-logo" aria-label="Alacena Mágica · Inicio">
        <img src="assets/logos/Alacena_Magica_Alacena_Magica_Logo_Color.png" alt="Alacena Mágica Logo" class="nav-logo-img" />
      </a>

      <!-- NAVEGACIÓN -->
      <nav class="nav-links" id="menu" aria-label="Navegación principal">
        <ul>
          <li><a href="#demo">Pruébalo</a></li>
          <li><a href="#funciones">Funciones</a></li>
          <li><a href="#como-funciona">Cómo funciona</a></li>
          <li><a href="#opiniones">Opiniones</a></li>
        </ul>
        <!-- BOTÓN CTA EN MAYÚSCULAS -->
        <a href="#cta" class="nav-cta btn">DESCUBRE LA MAGIA →</a>
      </nav>

      <!-- BOTÓN HAMBURGUESA (Móvil) -->
      <button class="nav-burger" id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero" id="demo">
    <div>
      <h1>Bienvenido a Alacena Mágica</h1>
      <p>Tu cocina inteligente empieza aquí.</p>
    </div>
  </section>

  <script>
    // Lógica simple para el menú móvil y scroll
    const nav = document.getElementById('nav');
    const burger = document.getElementById('burger');
    const menu = document.getElementById('menu');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) nav.classList.add('is-scrolled');
      else nav.classList.remove('is-scrolled');
    });

    burger.addEventListener('click', () => {
      const isOpen = burger.getAttribute('aria-expanded') === 'true';
      burger.setAttribute('aria-expanded', !isOpen);
      menu.classList.toggle('is-open');
    });
  </script>
</body>
</html>
